{% extends "_base.html" %}


{% block title %}
Editar conteúdo
{% endblock %}


{% block content %}

<!-- Cabeçalho da página -->
<section class="page-header">

    <span class="page-label">
        EDIÇÃO
    </span>

    <h2>Editar conteúdo</h2>

    <p>
        Altere as informações abaixo e salve as modificações.
    </p>

</section>


<!-- Card do formulário -->
<section class="form-card">

    <form method="POST">

        <!-- Campo título -->
        <div class="form-group">

            <label for="title">
                Título
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ content['c_title'] }}"
                placeholder="Digite o título do conteúdo"
                required
            >

        </div>


        <!-- Campo conteúdo -->
        <div class="form-group">

            <label for="text">
                Conteúdo
            </label>

            <textarea
                id="text"
                name="text"
                rows="7"
                placeholder="Digite o conteúdo aqui..."
                required
            >{{ content["c_text"] }}</textarea>

        </div>


        <!-- Botões -->
        <div class="form-actions">

            <button
                type="submit"
                class="btn-primary"
            >
                Salvar alterações
            </button>


            <a
                href="{{ url_for('view', c_id=content['c_id']) }}"
                class="btn-secondary"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>


{% endblock %}
