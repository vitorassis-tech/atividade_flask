{% extends "_base.html" %}


{% block title %}
Novo conteúdo
{% endblock %}


{% block content %}

<h2>Cadastrar novo conteúdo</h2>

<p>
    Preencha os campos abaixo para adicionar um novo conteúdo.
</p>


<form method="POST">

    <p>
        <label for="title">
            <strong>Título:</strong>
        </label>
        <br>

        <input
            type="text"
            id="title"
            name="title"
            required
        >
    </p>


    <p>
        <label for="text">
            <strong>Conteúdo:</strong>
        </label>
        <br>

        <textarea
            id="text"
            name="text"
            rows="6"
            required
        ></textarea>
    </p>


    <p>
        <button type="submit">
            Cadastrar
        </button>
    </p>

</form>


<p>
    <a href="{{ url_for('index') }}">
        ← Voltar para o início
    </a>
</p>

{% endblock %}
