{% extends "_base.html" %}


{% block title %}
Novo conteúdo
{% endblock %}


{% block content %}

<section class="page-header">

    <span class="page-label">
        CADASTRO
    </span>

    <h2>Novo conteúdo</h2>

    <p>
        Preencha as informações abaixo para adicionar
        um novo conteúdo ao banco de dados.
    </p>

</section>


<section class="form-card">

    <form method="POST">

        <div class="form-group">

            <label for="title">
                Título
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Digite o título do conteúdo"
                required
            >

        </div>


        <div class="form-group">

            <label for="text">
                Conteúdo
            </label>

            <textarea
                id="text"
                name="text"
                rows="7"
                placeholder="Digite o conteúdo aqui..."
                required
            ></textarea>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn-primary"
            >
                + Cadastrar conteúdo
            </button>


            <a
                href="{{ url_for('index') }}"
                class="btn-secondary"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>


{% endblock %}
